name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      # payments-mock is its own package (own package.json/node_modules,
      # spec 03 Decisions: "its own package") — installed and tested here
      # independently of the root install above.
      - name: Install payments-mock dependencies
        run: npm ci
        working-directory: payments-mock

      - name: Run payments-mock tests
        run: npm test
        working-directory: payments-mock

  # Integration + e2e specs open a real connection to a migrated Postgres
  # (data-source.integration.spec.ts, order.mapper.integration.spec.ts,
  # app.e2e-spec.ts) — required by design, not just recommended, so they
  # get a real DB here rather than mocks. Informational only: not a
  # required status check on main, since these need to have already been
  # run and confirmed locally (docker compose up postgres) before opening
  # the PR.
  integration:
    name: Integration + e2e tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: canals
          POSTGRES_USER: canals
          POSTGRES_PASSWORD: canals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U canals"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://canals:canals@localhost:5432/canals
      PAYMENTS_URL: http://localhost:4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      GEOCODING_DRIVER: static

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SPEC 05 (P4): create-order.use-case.integration.spec.ts and
      # orders.e2e-spec.ts are the first integration/e2e specs to call a
      # real PaymentGateway.charge() — every P1/P2 payment test before
      # them was a unit test against a mocked fetch. Without a real
      # payments-mock listening on PAYMENTS_URL, every charge() attempt
      # here gets ECONNREFUSED, exhausts retries and can trip the
      # in-process circuit breaker for the rest of the run.
      - name: Start payments-mock
        run: docker compose up -d --build --wait payments-mock

      - name: Run migrations
        run: npm run migration:run

      - name: Run integration tests
        run: npm run test:integration

      - name: Run e2e tests
        run: npm run test:e2e
