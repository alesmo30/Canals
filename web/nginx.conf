server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: client-side routes (/executions/:id) fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles never change; index.html must not be cached.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
